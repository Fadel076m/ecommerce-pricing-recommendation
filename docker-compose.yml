services:
  postgres:
    image: postgres:16
    container_name: ecommerce_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce_dw}
      POSTGRES_USER: ${POSTGRES_USER:-ecommerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.14.1
    container_name: ecommerce_mlflow
    restart: unless-stopped
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri /mlflow/mlruns
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow/mlruns

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: ecommerce_api
    restart: unless-stopped
    env_file: .env
    environment:
      # Dans le réseau docker-compose, les services se joignent par leur nom,
      # pas par localhost (surcharge les valeurs de .env prévues pour un usage
      # local hors conteneur).
      POSTGRES_HOST: postgres
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      # Artefacts entraînés localement (make forecast/pricing/recommend, non
      # versionnés) : montés en lecture seule, pas rebuild d'image à chaque run.
      - ./models:/app/models:ro
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    container_name: ecommerce_dashboard
    restart: unless-stopped
    env_file: .env
    environment:
      # Le dashboard appelle l'API par son nom de service dans le réseau
      # docker-compose, pas localhost (cf. api service ci-dessus).
      API_BASE_URL: http://api:8000
    ports:
      - "8050:8050"
    depends_on:
      - api

  # Streaming simulé (Kafka, profil optionnel "streaming") : ne démarre jamais
  # avec `docker compose up` par défaut ni avec `make demo` — il faut le lister
  # explicitement (`docker compose --profile streaming up -d kafka`). Mode KRaft
  # (pas de Zookeeper), un seul broker, suffisant pour une démonstration.
  kafka:
    image: apache/kafka:3.7.0
    container_name: ecommerce_kafka
    restart: unless-stopped
    profiles: ["streaming"]
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:19093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: ecommerce-streaming-demo

volumes:
  pg_data:
  mlflow_data:
