services:
  postgres:
    image: postgres:16
    container_name: ecommerce_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce_dw}
      POSTGRES_USER: ${POSTGRES_USER:-ecommerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.14.1
    container_name: ecommerce_mlflow
    restart: unless-stopped
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri /mlflow/mlruns
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow/mlruns

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: ecommerce_api
    restart: unless-stopped
    env_file: .env
    environment:
      # Dans le réseau docker-compose, les services se joignent par leur nom,
      # pas par localhost (surcharge les valeurs de .env prévues pour un usage
      # local hors conteneur).
      POSTGRES_HOST: postgres
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      # Artefacts entraînés localement (make forecast/pricing/recommend, non
      # versionnés) : montés en lecture seule, pas rebuild d'image à chaque run.
      - ./models:/app/models:ro
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    container_name: ecommerce_dashboard
    restart: unless-stopped
    env_file: .env
    ports:
      - "8050:8050"
    depends_on:
      - api

volumes:
  pg_data:
  mlflow_data:
